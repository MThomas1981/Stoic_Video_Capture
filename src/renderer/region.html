<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Select area</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif; background: rgba(0, 0, 0, 0.35); }
  #box { position: fixed; border: 2px solid #4ade80; background: rgba(74, 222, 128, 0.08);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); display: none; }
  body.selecting { background: transparent; }
  #size { position: absolute; top: -28px; left: 0; background: #4ade80; color: #08130c;
    font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
  #hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); color: #fff;
    background: rgba(15, 17, 21, 0.9); padding: 10px 18px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
  <div id="hint">Drag to select the area to record. Press Enter to confirm, Esc to cancel.</div>
  <div id="box"><span id="size"></span></div>
  <script src="region.js"></script>
</body>
</html>
